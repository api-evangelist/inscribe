    CustomerRiskAssessment:
      type: object
      description: Contains customer risk assessment data, including risk indicators and related insights.
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of the latest customer review agent run for this customer. `null` if no run exists yet.
          example: 1d5d7a72-7a89-4e3f-9b14-2a3c1c86bbb0
        status:
          type:
          - string
          - 'null'
          description: The status of the latest customer review agent run. `null` if no run exists yet.
          enum:
          - PENDING
          - RUNNING
          - FINISHED
          - FAILED
          example: FINISHED
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time at which the latest customer review agent run started. `null` if no run exists yet.
          example: '2026-04-09T15:35:08.460Z'
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time at which the latest customer review agent run finished. `null` if no run exists yet, or the run is still in progress.
          example: '2026-04-09T15:36:12.120Z'
        risk_level:
          type:
          - string
          - 'null'
          description: The risk level assigned to the customer. `null` if no risk level has been determined yet.
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - NOT_APPLICABLE
          example: HIGH
        summary:
          type:
          - string
          - 'null'
          description: A summary of the customer analysis. `null` if no analysis has completed yet.
          example: High risk assessment due to company status showing as inactive across multiple verification sources.
        insights:
          type: array
          description: 'List of relevant customer-level insights. An insight can be derived from a customer fraud signal, or a verification. An insight can be configured to be turned on or off. Not all insights are enabled by default. You can contact Inscribe <a href="#" onclick="Intercom(''showNewMessage'')">via intercom</a> to enquire about enabling or disabling individual insights.

            '
          items:
            $ref: '#/components/schemas/CustomerInsight'
