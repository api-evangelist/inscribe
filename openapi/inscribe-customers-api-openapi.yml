    CustomerInsight:
      type: object
      description: A customer-level insight derived from a customer fraud signal or a verification.
      properties:
        type:
          type: string
          description: 'The type of customer insight. (`SALARY_CROSS_CHECK` is deprecated: new insights of this type are no longer generated, but it may still be returned for customers where it was previously created.)'
          enum:
          - COMPANY_ADDRESS_EXISTENCE
          - COMPANY_EXISTENCE
          - COMPANY_WEB_PRESENCE
          - CONNECTION_BETWEEN_COMPANY_AND_ADDRESS
          - CONNECTION_BETWEEN_PERSON_AND_ADDRESS
          - CONNECTION_BETWEEN_PERSON_AND_COMPANY
          - MULTIPLE_DOCUMENT_RISK_SIGNALS
          - MULTIPLE_HIGH_RISK_DOCUMENTS
          - PERSON_ADDRESS_EXISTENCE
          - PREVIOUS_HIGH_RISK_APPLICATIONS
          - SALARY_CROSS_CHECK
          - UNUSUAL_TRANSACTION_PATTERNS
          - INCORPORATION_STATUS
          - WEB_PRESENCE
          - ADVERSE_MEDIA
          - ADDRESS_VERIFICATION
          - COUNTRY_RISK_SCREENING
          - INDUSTRY_RISK_SCREENING
          - TRANSACTION_ACTIVITY
          - SOURCE_OF_FUNDS
          - CONNECTION_TO_COMPANY
          - ADVERSE_MEDIA_INDIVIDUAL
          - CUSTOM_INSIGHT
          example: COMPANY_EXISTENCE
        result:
          type: string
          description: The result of the customer insight.
          enum:
          - PASS
          - INCONCLUSIVE
          - FAIL
          example: FAIL
        title:
          type:
          - string
          - 'null'
          description: A title describing the customer insight.
          example: Existence of Acme Inc
        rationale:
          type:
          - string
          - 'null'
          description: Detailed explanation of customer insight.
          example: Company appears as inactive or dissolved in multiple business registries and verification sources.
        urls:
          type:
          - array
          - 'null'
          items:
            type: string
          description: URLs with the sources that support the customer insight.
          example:
          - https://example.com/business-registry/123
          - https://example.com/company-verification/456
        scopes:
          type: array
          items:
            type: string
            enum:
            - FRAUD
          description: Categories this insight belongs to. Currently, the only supported scope is "FRAUD", which indicates that the insight contributes to assessing risk_level. In the future, additional scopes may be introduced to represent other types of risk beyond fraud.
          example:
          - FRAUD
        target:
          type: string
          description: 'Indicates what entity this insight pertains to. `COMPANY` — the insight relates to a company-level check (e.g. web presence, adverse media, incorporation status, company existence). `INDIVIDUAL` — the insight relates to checks on an individual person (e.g. adverse media for an individual, connection to company, person address existence). `APPLICATION` — the insight relates to the application as a whole rather than a specific entity (e.g. document fraud signals, previous high-risk applications). This field is always present.

            '
          enum:
          - COMPANY
          - INDIVIDUAL
          - APPLICATION
          example: COMPANY
        sub_insights:
          type:
          - array
          - 'null'
          description: List of sub-insights that provide additional detail for this insight. This field is only included when sub-insights are present.
          items:
            type: object
            properties:
              type:
                type: string
                description: The type of sub-insight.
                example: WEBSITE_PRESENCE
              title:
                type: string
                description: A title describing the sub-insight.
                example: Website Presence
              result:
                type: string
                description: The result of the sub-insight.
                enum:
                - PASS
                - INCONCLUSIVE
                - FAIL
                example: PASS
              rationale:
                type: string
                description: Detailed explanation of the sub-insight result.
                example: A website for this company exists.
              urls:
                type:
                - array
                - 'null'
                items:
                  type: string
                description: URLs with the sources that support the sub-insight. This field is excluded from the response if the array is empty.
                example:
                - https://example.com/sub-insight-source
        owner_name:
          type:
          - string
          - 'null'
          description: The name of the owner associated with this insight, if applicable. This field is only included when an owner name is present.
          example: John Doe
