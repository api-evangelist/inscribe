tags:
- name: Reachability Check
paths:
  /health:
    get:
      tags:
      - Reachability Check
      summary: Reachability Check
      description: 'By querying this endpoint, you can check if it''s possible to reach Inscribe''s services from your own infrastructure. This endpoint does not require any authentication but is rate limited.

        It does not indicate that all services are working without an error. For those notifications, please subscribe to our status page at .'
      operationId: reachability-check
      responses:
        '200':
          description: Reachability check succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  responses:
    TooManyRequests:
      description: Too many requests. The request has been rate limited. For more information, visit our [documentation on rate limiting](https://docs.inscribe.ai/docs/are-the-endpoints-rate-limited).
      content:
        text/plain:
          example: Requests are limited to 200 requests over a 5 minute period. Please try again in 30 seconds
      headers:
        Retry-After:
          description: The number of seconds to wait before retrying the request.
          schema:
            type: integer
            example: 30
  schemas:
    Health:
      type: object
      description: Response for the reachability check endpoint
      properties:
        success:
          type: boolean
          description: Did the request succeed?
          example: true
        status:
          type: integer
          description: http status code
          example: 200
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      x-default: Inscribe <API KEY>
