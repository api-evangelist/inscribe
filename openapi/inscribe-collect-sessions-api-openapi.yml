          description: 'The current state of the document, it has the following options: PROCESSING - This document is still being processed. PROCESSED - This document has finished processing and results are available. ERROR_PROCESSING - An error occurred while processing this document. VIRUS_DETECTED - This document was found to contain a virus and will not be processed. CORRUPT_DATA_DETECTED - This document was found to contain corrupted data and could not be processed. PASSWORD_PROTECTED - This document is password protected. EXCEEDS_MAX_PAGE_COUNT - This document exceeds the maximum page count of 350.'
          enum:
          - PROCESSING
          - PROCESSED
          - ERROR_PROCESSING
          - VIRUS_DETECTED
          - CORRUPT_DATA_DETECTED
          - PASSWORD_PROTECTED
          - EXCEEDS_MAX_PAGE_COUNT
          example: PROCESSED
        total_pages:
          type: integer
          description: The number of pages in the document. This value will be null until the document is in the PROCESSED state.
          example: 1
        document_type:
          type: string
          description: The document type identified by Inscribe's classifier. This value will be null until the document is in the PROCESSED state.
          example: BANK_STATEMENT
          enum:
          - UNKNOWN
          - BANK_STATEMENT
          - BANK_LETTER
          - BENEFITS_STATEMENT
          - BUSINESS_FILING
          - CHECK
          - CREDIT_CARD_STATEMENT
          - DRIVING_LICENSE
          - EMPLOYMENT_LETTER
          - FINANCIAL_STATEMENT
          - INSURANCE_STATEMENT
          - INVESTMENT_STATEMENT
          - INVOICE
          - LEASE
          - LOAN_DOCUMENT
          - PAYSLIP
          - SOCIAL_SECURITY_CARD
          - TAX_FORM
          - UTILITY_BILL
        subtypes:
          type: array
          description: 'A list of the document subtypes identified by Inscribe''s classifier. Currently, subtypes are identified for "TAX_FORM", "BANK_STATEMENT", "UTILITY_BILL", "PAYSLIP", "BUSINESS_FILING", and "FINANCIAL_STATEMENT" document types.

            Tax documents can have the subtypes: "CP_575", "LTR_147C", "SS4", "W2", "W3", "W9", "FORM_1040", "FORM_1040_SCHEDULE_C", "FORM_1065", "FORM_1099_MISC", "FORM_1099_NEC", "FORM_1120", "FORM_1120_S", "T1", "T183", "T2", "T2_CORP", "T4", "T451".

            Financial statement documents can have the subtypes: "PROFIT_AND_LOSS".

            Business filing documents can have the subtypes: "CERTIFICATE_OF_INCORPORATION", "CERTIFICATE_OF_FORMATION", "CERTIFICATE_OF_ORGANIZATION", "ARTICLES_OF_ORGANIZATION", "ARTICLES_OF_INCORPORATION", "PARTNERSHIP_AGREEMENT", "CERTIFICATE_OF_GOOD_STANDING", "OPERATING_AGREEMENT". French language business filings can also have the subtypes: "VAT_REGISTRATION", "COMMERCIAL_REGISTER_EXTRACT", "ARTISAN_REGISTER_EXTRACT", "SIREN_REGISTER_EXTRACT", "SIREN_NUMBER_CONFIRMATION", "ARTICLES_OF_ASSOCIATION", "CERTIFICATE_OF_REGISTRATION", "EXTRACT_FROM_THE_OFFICIAL_GAZETTE", "RECEIPT_OF_DECLARATION_OF_CREATION".

            Utility bill documents can have the subtypes: "ENGIE", "ELECTRICITE_DE_FRANCE".

            Payslip documents can have the subtypes: "AUTOMATIC_DATA_PROCESSING".

            The full list of subtypes for bank statements can be found at https://docs.inscribe.ai/docs/documents-classified-by-bank-names.'
